name: Compila APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test e compilazione
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk Palestra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Palestra-APK
          path: Palestra.apk
